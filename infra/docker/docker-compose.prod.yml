# Production: one server running everything behind Caddy (automatic HTTPS).
#
#   docker compose -f infra/docker/docker-compose.prod.yml --env-file ~/tailorae.env up -d --build
#
# Every value comes from the env file (see infra/docker/prod.env.example). Nothing
# here has a development fallback: a missing secret stops `up` with an error
# instead of starting with a guessable value. Only Caddy publishes ports; the
# database, Kafka, API and web app are reachable only on the internal network.
#
# Uploaded files go to S3 (STORAGE_TYPE=s3), so the API keeps nothing on disk.
name: tailorae-prod

x-restart: &restart
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    <<: *restart
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USER:?set DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
      POSTGRES_DB: tailorae_api
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d tailorae_api"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 768m

  # Single-node Kafka (KRaft). Topics are declared by the API with replication 1.
  kafka:
    <<: *restart
    image: apache/kafka:4.3.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx384m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    mem_limit: 640m

  api:
    <<: *restart
    build: ../../apps/api
    image: tailorae-api:prod
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/tailorae_api
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?set FIELD_ENCRYPTION_KEY}
      SECURE_COOKIES: "true"
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?set BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD}
      WEB_ORIGINS: https://${WEB_DOMAIN:?set WEB_DOMAIN}
      WEB_URL: https://${WEB_DOMAIN}
      API_PUBLIC_URL: https://${API_DOMAIN:?set API_DOMAIN}
      WEB_REVALIDATE_URL: http://web:3000/api/content/revalidate
      CONTENT_REVALIDATE_SECRET: ${CONTENT_REVALIDATE_SECRET:?set CONTENT_REVALIDATE_SECRET}
      # Files: S3. Public bucket = images (world-readable), private = KYC (signed links only).
      STORAGE_TYPE: s3
      STORAGE_SIGNING_KEY: ${STORAGE_SIGNING_KEY:?set STORAGE_SIGNING_KEY}
      S3_REGION: ${S3_REGION:?set S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:?set S3_PUBLIC_BUCKET}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:?set S3_PRIVATE_BUCKET}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:?set S3_PUBLIC_BASE_URL}
      # AWS S3 itself: virtual-hosted addressing (bucket.s3.region.amazonaws.com).
      TAILORAE_STORAGE_S3_PATH_STYLE: "false"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:-TAILORAE <no-reply@${WEB_DOMAIN}>}
      # An email-provider outage must not mark the API unhealthy (mail is sent from the outbox and retried).
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      # No SMS provider yet: true prints seller phone codes to `docker compose logs api`.
      TAILORAE_SMS_LOG_CODES: ${TAILORAE_SMS_LOG_CODES:-false}
      # Platform threads, not virtual: on JDK 21 Kafka's consumer heartbeat threads park
      # inside `synchronized` and pin the carrier threads; with 2 vCPUs that froze every
      # request within minutes. Revisit on JDK 24+ (JEP 491 removes monitor pinning).
      SPRING_THREADS_VIRTUAL_ENABLED: "false"
      # Heap = 70% of the container limit below; the rest is metaspace, threads, buffers.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"
    mem_limit: 1280m

  web:
    <<: *restart
    build:
      context: ../../apps/web
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}/api
        NEXT_PUBLIC_APP_URL: https://${WEB_DOMAIN}
        MEDIA_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-}
        NEXT_PUBLIC_SUPPORT_PHONE: ${NEXT_PUBLIC_SUPPORT_PHONE:-}
        NEXT_PUBLIC_SUPPORT_ADDRESS: ${NEXT_PUBLIC_SUPPORT_ADDRESS:-}
    image: tailorae-web:prod
    depends_on:
      - api
    environment:
      # Server renders reach the API inside the Docker network, not via the internet.
      API_URL_INTERNAL: http://api:8081/api
      CONTENT_REVALIDATE_SECRET: ${CONTENT_REVALIDATE_SECRET}
    mem_limit: 768m

  caddy:
    <<: *restart
    image: caddy:2.10.2-alpine
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m

volumes:
  postgres_data:
  kafka_data:
  caddy_data:
  caddy_config:
