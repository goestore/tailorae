# Local development services. Start with `npm run db:up` from the repo root.
# Build contexts are relative to this file (infra/docker/).
name: tailorae

services:
  postgres:
    image: postgres:15-alpine
    container_name: tailorae-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tailorae
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - tailorae-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tailorae-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tailorae-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  adminer:
    image: adminer
    container_name: tailorae-adminer
    ports:
      - "8080:8080"
    networks:
      - tailorae-network
    depends_on:
      - postgres

  # Single-node Kafka in KRaft mode (no ZooKeeper). Clients on the host use
  # localhost:9092; containers on this network use kafka:29092.
  kafka:
    image: apache/kafka:4.3.2
    container_name: tailorae-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: HOST://0.0.0.0:9092,DOCKER://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Topics are declared by the API (NewTopic beans), not created on first use.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - tailorae-network

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: tailorae-kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: tailorae
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - tailorae-network
    depends_on:
      - kafka

  # Catches every email the API sends in development: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.33.0
    container_name: tailorae-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - tailorae-network

  # The application itself, for a full-stack run: `docker compose --profile app up --build`.
  # Day-to-day development runs the API with ./gradlew bootRun and the web app with npm run dev.
  api:
    profiles: ["app"]
    build: ../../apps/api
    container_name: tailorae-api
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/tailorae_api
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SMTP_HOST: mailpit
      JWT_SECRET: ${JWT_SECRET:-local-only-jwt-secret-change-me-0123456789abcdef}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      SECURE_COOKIES: "false"
      WEB_ORIGINS: http://localhost:3000
      WEB_URL: http://localhost:3000
      API_PUBLIC_URL: http://localhost:8081
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@tailorae.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    ports:
      - "8081:8081"
    volumes:
      - api_storage:/data/storage
    networks:
      - tailorae-network

  web:
    profiles: ["app"]
    build:
      context: ../../apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8081/api
        NEXT_PUBLIC_APP_URL: http://localhost:3000
    container_name: tailorae-web
    depends_on:
      - api
    ports:
      - "3000:3000"
    networks:
      - tailorae-network

volumes:
  api_storage:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local

networks:
  tailorae-network:
    driver: bridge
