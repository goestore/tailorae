server:
  port: ${PORT:8081}
  # gzip JSON and CSV responses over 1 KB (a product list shrinks to about a fifth).
  compression:
    enabled: true
    mime-types: application/json,text/csv,text/plain
    min-response-size: 1024
  # Real client IPs behind the load balancer, for session records and rate limits.
  forward-headers-strategy: native

spring:
  application:
    name: tailorae-api
  # Local secrets for `npm run dev:api` live in apps/api/.env (see apps/api/.env.example); absent in production.
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/tailorae_api}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks it matches the entities.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
    # Modules own reserved version ranges (V30s catalog, V50s orders, V60s content,
    # V70s admin), so a lower number can land after a higher one.
    out-of-order: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 40MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

tailorae:
  auth:
    jwt-secret: ${JWT_SECRET}
    secure-cookies: ${SECURE_COOKIES:true}
    bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  web:
    origins: ${WEB_ORIGINS:http://localhost:3000}
    # POSTed after content publishes and catalogue changes so the storefront drops its
    # cache (web: /api/content/revalidate). Unset = no-op. Same secret as the web app's.
    revalidate-url: ${WEB_REVALIDATE_URL:}
    revalidate-secret: ${CONTENT_REVALIDATE_SECRET:}
  mail:
    from: ${MAIL_FROM:TAILORAE <no-reply@tailorae.com>}
    web-url: ${WEB_URL:http://localhost:3000}
    # Staff alerts (new seller applications, custom-wear quotes). Blank sends none.
    admin-email: ${ADMIN_EMAIL:admin@tailorae.com}
  outbox:
    poll-ms: 1000
  storage:
    # local (disk, served by this API — dev) or s3 (any S3-compatible service — production).
    type: ${STORAGE_TYPE:local}
    root: ${STORAGE_ROOT:./data/storage}
    public-base-url: ${API_PUBLIC_URL:http://localhost:8081}
    signing-key: ${STORAGE_SIGNING_KEY:dev-only-signing-key-change-me}
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:ap-south-1}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      public-bucket: ${S3_PUBLIC_BUCKET:tailorae-public}
      private-bucket: ${S3_PRIVATE_BUCKET:tailorae-private}
      public-base-url: ${S3_PUBLIC_BASE_URL:}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  sms:
    # Until an SMS provider is chosen, print phone codes to the log (dev only).
    log-codes: ${TAILORAE_SMS_LOG_CODES:false}
  crypto:
    # 32 random bytes, base64 (openssl rand -base64 32). Encrypts bank account numbers.
    field-key: ${FIELD_ENCRYPTION_KEY:}
