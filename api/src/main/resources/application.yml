server:
  port: ${PORT:8081}
  # Real client IPs behind the load balancer, for session records and rate limits.
  forward-headers-strategy: native

spring:
  application:
    name: tailorae-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/tailorae_api}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks it matches the entities.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
    # Modules own reserved version ranges (V30s catalog, V50s orders, V60s content,
    # V70s admin), so a lower number can land after a higher one.
    out-of-order: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 40MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

tailorae:
  auth:
    jwt-secret: ${JWT_SECRET}
    secure-cookies: ${SECURE_COOKIES:true}
    bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  web:
    origins: ${WEB_ORIGINS:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:TAILORAE <no-reply@tailorae.com>}
    web-url: ${WEB_URL:http://localhost:3000}
  outbox:
    poll-ms: 1000
  storage:
    root: ${STORAGE_ROOT:./data/storage}
    public-base-url: ${API_PUBLIC_URL:http://localhost:8081}
    signing-key: ${STORAGE_SIGNING_KEY:dev-only-signing-key-change-me}
  crypto:
    # 32 random bytes, base64 (openssl rand -base64 32). Encrypts bank account numbers.
    field-key: ${FIELD_ENCRYPTION_KEY:}
