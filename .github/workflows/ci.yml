name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Kotlin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # Unit and integration tests; Testcontainers uses the runner's Docker.
      - run: ./gradlew test --console=plain
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: apps/api/build/reports/tests/test

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx eslint src
      - run: npx tsc --noEmit -p .
      - run: npx vitest run
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8081/api
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  # Runs alongside the tests rather than after them: nothing is pushed, so there
  # is no reason to wait, and waiting doubled the run (≈4 min tests + ≈4 min images).
  images:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: false
          tags: tailorae-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: false
          tags: tailorae-web:ci
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.tailorae.com/api
            NEXT_PUBLIC_APP_URL=https://tailorae.com
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
